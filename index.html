<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Sorriso - Clínica Odontológica em Pinheiros, São Paulo</title>
    <meta name="description" content="Clínica odontológica de alto padrão em Pinheiros, São Paulo. +20 dentistas especialistas, mestres e doutores pela USP, UNICAMP, UNESP. Implantes, Invisalign, Prótese Protocolo e mais.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a7c6c;
            --primary-dark: #065a4e;
            --primary-light: #e6f5f3;
            --accent: #c9a84c;
            --accent-light: #fdf6e3;
            --text-dark: #1a2e2a;
            --text-body: #3d5a54;
            --text-light: #6b8a83;
            --bg-white: #ffffff;
            --bg-off: #f8fbfa;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(10,124,108,0.10);
            --shadow-lg: 0 12px 40px rgba(10,124,108,0.14);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-body);
            background: var(--bg-white);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(10,124,108,0.08);
            transition: box-shadow 0.3s ease;
        }

        header.scrolled {
            box-shadow: var(--shadow-md);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), #0d9e8a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-text strong {
            font-size: 17px;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-body);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            transition: color 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        nav a:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .nav-cta {
            background: var(--primary) !important;
            color: white !important;
            font-weight: 600 !important;
            padding: 10px 22px !important;
            border-radius: 50px !important;
            margin-left: 8px;
            box-shadow: 0 2px 10px rgba(10,124,108,0.3);
        }

        .nav-cta:hover {
            background: var(--primary-dark) !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(10,124,108,0.4) !important;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-direction: column;
            gap: 5px;
        }

        .mobile-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-dark);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* ===== HERO ===== */
        .hero {
            padding: 140px 0 80px;
            background: linear-gradient(160deg, #f0faf8 0%, #ffffff 40%, #fdf9ef 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(10,124,108,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 24px;
            border: 1px solid rgba(10,124,108,0.12);
        }

        .hero-badge .dot {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .hero h1 {
            font-size: clamp(32px, 4.5vw, 52px);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--primary);
            position: relative;
        }

        .hero h1 em::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(201,168,76,0.25);
            border-radius: 4px;
            z-index: -1;
        }

        .hero p {
            font-size: 17px;
            color: var(--text-body);
            max-width: 520px;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            line-height: 1;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px rgba(10,124,108,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(10,124,108,0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid rgba(10,124,108,0.25);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
        }

        .hero-stat strong {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero-stat span {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
            margin-top: 2px;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 36px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
        }

        .hero-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .hero-card-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-light), #d0efe9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .hero-card-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .hero-card-header p {
            font-size: 13px;
            color: var(--text-light);
            margin: 0;
            line-height: 1.4;
        }

        .hero-card-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .hero-card-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-body);
            font-weight: 500;
        }

        .hero-card-list li .check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .hero-card-footer {
            background: var(--bg-off);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-light);
        }

        .hero-card-footer .stars {
            color: #f5a623;
            letter-spacing: 2px;
            font-size: 14px;
        }

        /* ===== SECTION COMMON ===== */
        section {
            padding: 80px 0;
        }

        .section-label {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .section-title {
            font-size: clamp(26px, 3.5vw, 38px);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .section-subtitle {
            font-size: 16px;
            color: var(--text-light);
            max-width: 620px;
            line-height: 1.8;
        }

        .section-header {
            margin-bottom: 48px;
        }

        .section-header.centered {
            text-align: center;
        }

        .section-header.centered .section-subtitle {
            margin: 0 auto;
        }

        /* ===== ABOUT ===== */
        .about {
            background: var(--bg-off);
        }

        .about-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-visual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .about-img {
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            transition: transform 0.3s ease;
        }

        .about-img:hover {
            transform: scale(1.03);
        }

        .about-img:nth-child(1) {
            background: linear-gradient(135deg, #e6f5f3, #b8e6de);
            grid-row: span 2;
            aspect-ratio: auto;
            font-size: 64px;
        }

        .about-img:nth-child(2) {
            background: linear-gradient(135deg, #fdf6e3, #f5e6b8);
        }

        .about-img:nth-child(3) {
            background: linear-gradient(135deg, #e8f0fe, #c5d8f5);
        }

        .about-text .section-subtitle {
            margin-bottom: 24px;
        }

        .about-features {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
        }

        .about-feature {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .about-feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .about-feature h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 3px;
        }

        .about-feature p {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
            margin: 0;
        }

        /* ===== SPECIALTIES ===== */
        .specialties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .specialty-card {
            background: white;
            border: 1px solid rgba(10,124,108,0.08);
            border-radius: var(--radius-md);
            padding: 32px 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .specialty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .specialty-card:hover {
            border-color: rgba(10,124,108,0.2);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .specialty-card:hover::before {
            opacity: 1;
        }

        .specialty-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .specialty-card h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .specialty-card p {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.7;
            margin: 0;
        }

        /* ===== HIGHLIGHT ===== */
        .highlight {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .highlight::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .highlight .section-title {
            color: white;
        }

        .highlight .section-subtitle {
            color: rgba(255,255,255,0.8);
        }

        .highlight .section-label {
            color: var(--accent);
        }

        .highlight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .highlight-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            padding: 28px 24px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .highlight-card:hover {
            background: rgba(255,255,255,0.16);
            transform: translateY(-3px);
        }

        .highlight-card .num {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .highlight-card h4 {
            font-size: 15px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }

        .highlight-card p {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin: 0;
        }

        /* ===== TEAM ===== */
        .team {
            background: var(--bg-off);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 32px 20px;
            text-align: center;
            border: 1px solid rgba(10,124,108,0.06);
            transition: all 0.3s ease;
        }

        .team-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .team-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary-light), #d0efe9);
        }

        .team-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .team-card p {
            font-size: 13px;
            color: var(--text-light);
            margin: 0;
            line-height: 1.5;
        }

        /* ===== TESTIMONIALS ===== */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .testimonial-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 32px 28px;
            border: 1px solid rgba(10,124,108,0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .testimonial-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .testimonial-stars {
            color: #f5a623;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .testimonial-text {
            font-size: 14px;
            color: var(--text-body);
            line-height: 1.8;
            margin-bottom: 20px;
            flex-grow: 1;
            font-style: italic;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(10,124,108,0.08);
        }

        .testimonial-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .testimonial-author strong {
            font-size: 14px;
            color: var(--text-dark);
            display: block;
            line-height: 1.3;
        }

        .testimonial-author span {
            font-size: 12px;
            color: var(--text-light);
        }

        /* ===== FAQ ===== */
        .faq {
            background: var(--bg-off);
        }

        .faq-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .faq-item {
            background: white;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(10,124,108,0.08);
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .faq-item:hover {
            box-shadow: var(--shadow-sm);
        }

        .faq-question {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: left;
            transition: color 0.2s ease;
        }

        .faq-question:hover {
            color: var(--primary);
        }

        .faq-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
            line-height: 1;
        }

        .faq-item.open .faq-icon {
            transform: rotate(45deg);
            background: var(--primary);
            color: white;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 24px;
        }

        .faq-item.open .faq-answer {
            max-height: 400px;
            padding: 0 24px 22px;
        }

        .faq-answer p {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.8;
            margin: 0;
        }

        /* ===== CONTACT ===== */
        .contact {
            background: white;
        }

        .contact-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .contact-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .contact-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .contact-item h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .contact-item p,
        .contact-item a {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.7;
            margin: 0;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-item a:hover {
            color: var(--primary);
        }

        .contact-cta-box {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .contact-cta-box::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .contact-cta-box h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .contact-cta-box p {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            line-height: 1.8;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .contact-cta-box .btn {
            background: white;
            color: var(--primary-dark);
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .contact-cta-box .btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .contact-cta-box .note {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 14px;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--text-dark);
            color: rgba(255,255,255,0.7);
            padding: 60px 0 30px;
        }

        .footer-inner {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.2fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-brand .logo-text strong {
            color: white;
        }

        .footer-brand .logo-text span {
            color: rgba(255,255,255,0.5);
        }

        .footer-brand p {
            font-size: 13px;
            color: rgba(255,255,255,0.55);
            line-height: 1.8;
            margin-top: 16px;
            max-width: 300px;
        }

        .footer-col h4 {
            font-size: 13px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .footer-col ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-col ul li a,
        .footer-col ul li {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.2s ease;
            line-height: 1.6;
        }

        .footer-col ul li a:hover {
            color: var(--accent);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .footer-bottom p {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin: 0;
            line-height: 1.6;
        }

        .footer-bottom .cnpj {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        /* ===== WHATSAPP FLOAT ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #25d366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37,211,102,0.4);
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(37,211,102,0.5);
        }

            .hero-actions .btn {
                justify-content: center;
            }
